<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mustmissme - Shipping address</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    :root {
      --pink: #ff66c4;
      --cream: #fff3c2;
      --grey: #939396;
      /* แก้ความกว้างปุ่มทั้งหมดที่นี่ที่เดียว เช่น 55%, 70%, 200px */
      --btn-width: 55%;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #ffffff;
      font-family: "Prompt", sans-serif;
      color: #000;
    }

    /* การ์ดหลัก: พื้นชมพู + ส่วนฟอร์มสีครีมซ้อนด้านล่าง */
    .card {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      background: var(--pink);
      border-radius: 32px;
      overflow: hidden;
    }

    .header {
      text-align: center;
      color: #fff;
      padding: 26px 20px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 9vw, 38px);
      font-weight: 700;
      line-height: 1.15;
    }

    .sub {
      margin: 4px 0 0;
      font-size: 17px;
      font-weight: 500;
    }

    .panel {
      background: var(--cream);
      border-radius: 30px 30px 0 0;
      padding: 20px 28px 28px;
    }

    #status {
      margin: 0 0 12px;
      min-height: 1.4em;
      font-size: 12.5px;
      font-weight: 600;
      text-align: center;
      overflow-wrap: anywhere;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 15px 22px;
      margin: 0 0 14px;
      border: none;
      border-radius: 24px;
      background: #fff;
      color: #000;
      font-family: inherit;
      font-size: 14px;
      text-align: left;
    }

    input::placeholder, textarea::placeholder {
      color: var(--grey);
      font-size: 13px;
    }

    textarea {
      resize: none;
      overflow: hidden;
      line-height: 1.4;
      min-height: 50px;
    }

    #address {
      min-height: 100px;
      border-radius: 22px;
    }

    .note {
      margin: 2px 0 14px;
      font-size: 12px;
      font-weight: 500;
      text-align: center;
    }

    button {
      display: block;
      width: var(--btn-width);
      margin: 8px auto 0;
      padding: 10px 16px;
      border: none;
      border-radius: 999px;
      background: var(--pink);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ปุ่ม Update: พื้นขาว ตัวอักษรชมพู */
    .secondary { background: #fff; color: var(--pink); }

    /* ปุ่ม My address: พื้นดำ ตัวอักษรขาว */
    .dark { background: #000; color: #fff; }

    /* รายการ My address */
    .my-address { margin-top: 16px; }

    .order-card {
      margin: 10px 0 0;
      padding: 14px 20px;
      background: #fff;
      border-radius: 22px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .order-item {
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--grey);
      white-space: pre-line;
    }

    .order-name {
      color: var(--pink);
      font-size: 17px;
      font-weight: 600;
    }

    .order-line {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.55;
      white-space: pre-line;
    }

    .empty-orders {
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="header">
      <h1>mustmissme</h1>
      <p class="sub">Shipping address</p>
    </div>

    <div class="panel">
      <div id="status">กำลังเชื่อมต่อ LINE...</div>

      <textarea id="order" rows="1" placeholder="รอบพรี/สินค้า (กรอกตอนสั่งรอบใหม่)"></textarea>
      <input id="name" placeholder="Name" autocomplete="name">
      <textarea id="address" placeholder="Address" autocomplete="street-address"></textarea>
      <input id="zipcode" placeholder="Postal Code" inputmode="numeric" autocomplete="postal-code">
      <input id="phone" placeholder="Phone" inputmode="tel" autocomplete="tel">

      <div class="note">หากต้องการเปลี่ยนที่อยู่ให้กด Update</div>

      <button id="orderBtn" disabled onclick="submitData('newOrder')">Save</button>

      <button id="addressBtn" class="secondary" disabled onclick="submitData('updateAddress')">Update</button>

      <button id="myAddressBtn" class="dark" onclick="toggleMyAddress()">My address</button>

      <div id="myAddressBox" class="my-address" style="display:none">
        <div id="orderList" class="empty-orders">กำลังโหลด...</div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = "2012195926-1eZDGU46";
    const API_URL = "https://script.google.com/macros/s/AKfycbxrqJsNICtzUBDuwRWoIePCFQUed1r2NeD_w3y5_rHxSs1Ub9n57z8Q1bgLfd8jwEqg/exec"; // เช่น https://script.google.com/macros/s/xxxx/exec

    let idToken = "";

    const statusBox = document.getElementById("status");
    const orderBtn = document.getElementById("orderBtn");
    const addressBtn = document.getElementById("addressBtn");

    function setStatus(message) {
      statusBox.textContent = message;
    }

    // ปรับความสูงช่องข้อความให้พอดีกับสิ่งที่พิมพ์
    function autoGrow(el) {
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    document.querySelectorAll("textarea").forEach(t => {
      t.addEventListener("input", () => autoGrow(t));
    });

    // กดปุ่ม My address เพื่อเปิด/ปิดรายการที่อยู่ของออเดอร์
    function toggleMyAddress() {
      const box = document.getElementById("myAddressBox");
      box.style.display = box.style.display === "none" ? "block" : "none";
    }

    function setButtonsEnabled(enabled) {
      orderBtn.disabled = !enabled;
      addressBtn.disabled = !enabled;
    }

    // ใช้ text/plain เพื่อไม่ให้เกิด CORS preflight (GAS ไม่รองรับ OPTIONS)
    async function callApi(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");
      return json.data;
    }

    function makeEl(tag, cls, text) {
      const e = document.createElement(tag);
      e.className = cls;
      if (text) e.textContent = text;
      return e;
    }

    // แสดงรายการออเดอร์ (ใหม่ไปเก่า) ใช้ textContent เพื่อความปลอดภัย
    function renderOrders(orders) {
      const box = document.getElementById("orderList");
      box.innerHTML = "";

      if (!orders || orders.length === 0) {
        box.className = "empty-orders";
        box.textContent = "ยังไม่มีออเดอร์ 💗";
        return;
      }

      box.className = "";

      orders.forEach(item => {
        const card = makeEl("div", "order-card");
        if (item.order) card.appendChild(makeEl("div", "order-item", item.order));
        card.appendChild(makeEl("div", "order-name", item.name || "-"));
        if (item.address) card.appendChild(makeEl("div", "order-line", item.address));
        if (item.zipcode) card.appendChild(makeEl("div", "order-line", item.zipcode));
        if (item.phone) card.appendChild(makeEl("div", "order-line", item.phone));
        box.appendChild(card);
      });
    }

    async function loadOrders() {
      const box = document.getElementById("orderList");
      try {
        const result = await callApi({ action: "getOrders", idToken: idToken });
        renderOrders(result.orders);
      } catch (error) {
        box.className = "empty-orders";
        box.textContent = "โหลดรายการออเดอร์ไม่สำเร็จ: " +
          (error && error.message ? error.message : error);
      }
    }

    async function startLine() {
      setButtonsEnabled(false);
      setStatus("กำลังเชื่อมต่อ LINE...");

      try {
        if (typeof liff === "undefined") {
          throw new Error("โหลด LINE SDK ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
        }

        if (API_URL.includes("ใส่_")) {
          throw new Error("ยังไม่ได้ใส่ API_URL ของ GAS");
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStatus("กำลังเข้าสู่ระบบ LINE...");
          liff.login();
          return;
        }

        idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error("ไม่พบ ID Token กรุณาตรวจสอบว่า LIFF เปิด Scope openid แล้ว");
        }

        setStatus("กำลังโหลดข้อมูลลูกค้า...");
        const customer = await callApi({ action: "getCustomer", idToken });

        if (customer && customer.found) {
          document.getElementById("name").value = customer.name || "";
          document.getElementById("address").value = customer.address || "";
          document.getElementById("zipcode").value = customer.zipcode || "";
          document.getElementById("phone").value = customer.phone || "";
          autoGrow(document.getElementById("address"));
          setStatus("💗 โหลดข้อมูลที่อยู่เดิมแล้ว");
        } else {
          setStatus("ยินดีต้อนรับ 💗 กรุณากรอกข้อมูลจัดส่ง");
        }

        setButtonsEnabled(true);
        loadOrders();

      } catch (error) {
        console.error("LIFF error:", error);
        setStatus("เชื่อมต่อไม่สำเร็จ: " + (error && error.message ? error.message : error));
      }
    }

    async function submitData(mode) {
      if (!idToken) {
        setStatus("ยังยืนยันบัญชี LINE ไม่สำเร็จ กรุณาเปิดหน้าเว็บใหม่");
        return;
      }

      const data = {
        order: document.getElementById("order").value.trim(),
        name: document.getElementById("name").value.trim(),
        address: document.getElementById("address").value.trim(),
        zipcode: document.getElementById("zipcode").value.trim(),
        phone: document.getElementById("phone").value.trim()
      };

      if (!data.name || !data.address || !data.zipcode || !data.phone) {
        setStatus("❗ กรุณากรอกชื่อ ที่อยู่ รหัสไปรษณีย์ และเบอร์โทรให้ครบ");
        return;
      }

      if (mode === "newOrder" && !data.order) {
        setStatus("❗ กรุณากรอกรอบพรี/สินค้าก่อนบันทึกออเดอร์ใหม่");
        return;
      }

      setButtonsEnabled(false);
      setStatus("กำลังบันทึกข้อมูล...");

      try {
        const result = await callApi({
          action: "saveSubmission",
          idToken: idToken,
          mode: mode,
          order: data.order,
          name: data.name,
          address: data.address,
          zipcode: data.zipcode,
          phone: data.phone
        });

        setStatus("✅ " + result.message);
        if (mode === "newOrder") {
          const orderBox = document.getElementById("order");
          orderBox.value = "";
          autoGrow(orderBox);
        }
        loadOrders();
      } catch (error) {
        setStatus("❌ บันทึกไม่สำเร็จ: " + (error && error.message ? error.message : error));
      }

      setButtonsEnabled(true);
    }

    startLine();
  </script>
</body>
</html>
