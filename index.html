<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mustmissme - กรอกข้อมูลจัดส่ง</title>
  <link href="https://fonts.googleapis.com/css2?family=Mali&display=swap" rel="stylesheet">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      background: #fcb1d6;
      font-family: "Mali", sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: #fee998;
      padding: 25px;
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      margin: 35px auto;
    }

    h1 {
      color: #ff66b2;
      font-size: clamp(32px, 8vw, 48px);
      margin-bottom: 5px;
    }

    h2 {
      color: #6600ca;
      font-size: 25px;
      margin-top: 0;
    }

    .popup-box {
      background: #fee998;
      padding: 22px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 15px;
      font-family: "Mali", sans-serif;
      font-size: 15px;
      text-align: center;
    }

    textarea { resize: vertical; }
    #order { height: 75px; }
    #address { height: 100px; }

    button {
      background: #ff66b2;
      border: none;
      color: white;
      padding: 12px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-family: "Mali", sans-serif;
      font-size: 15px;
      margin: 6px 0;
      width: 100%;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .secondary { background: #6600ca; }

    #status {
      margin-top: 15px;
      font-weight: bold;
      color: #000;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 13px;
      color: #634b27;
      margin: 8px 0 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>mustmissme</h1>
    <h2>ข้อมูลจัดส่ง</h2>

    <div class="popup-box">
      <div id="status">กำลังเชื่อมต่อ LINE...</div>

      <textarea id="order" placeholder="รอบพรี/สินค้า (กรอกตอนสั่งรอบใหม่)"></textarea>
      <input id="name" placeholder="ชื่อ-นามสกุล" autocomplete="name">
      <textarea id="address" placeholder="ที่อยู่" autocomplete="street-address"></textarea>
      <input id="zipcode" placeholder="รหัสไปรษณีย์" inputmode="numeric" autocomplete="postal-code">
      <input id="phone" placeholder="เบอร์โทร" inputmode="tel" autocomplete="tel">

      <div class="note">
        หากต้องการเปลี่ยนที่อยู่ ให้กดอัปเดตที่อยู่เดิม
      </div>

      <button id="orderBtn" disabled onclick="submitData('newOrder')">
        บันทึก
      </button>

      <button id="addressBtn" class="secondary" disabled onclick="submitData('updateAddress')">
        อัปเดตที่อยู่เดิม
      </button>
    </div>
  </div>

  <script>
    const LIFF_ID = "2012195926-1eZDGU46";
    const API_URL = "https://script.google.com/macros/s/AKfycbwSlN_4_ODAjWNzltFyKRs0iUWKIrj50I208RxQWXqIXbTTmFtHLqI7-Bmrgc6n3phd/exec"; // เช่น https://script.google.com/macros/s/xxxx/exec

    let idToken = "";

    const statusBox = document.getElementById("status");
    const orderBtn = document.getElementById("orderBtn");
    const addressBtn = document.getElementById("addressBtn");

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function setButtonsEnabled(enabled) {
      orderBtn.disabled = !enabled;
      addressBtn.disabled = !enabled;
    }

    // ใช้ text/plain เพื่อไม่ให้เกิด CORS preflight (GAS ไม่รองรับ OPTIONS)
    async function callApi(payload) {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || "เกิดข้อผิดพลาด");
      return json.data;
    }

    async function startLine() {
      setButtonsEnabled(false);
      setStatus("กำลังเชื่อมต่อ LINE...");

      try {
        if (typeof liff === "undefined") {
          throw new Error("โหลด LINE SDK ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
        }

        if (API_URL.includes("ใส่_")) {
          throw new Error("ยังไม่ได้ใส่ API_URL ของ GAS");
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          setStatus("กำลังเข้าสู่ระบบ LINE...");
          liff.login();
          return;
        }

        idToken = liff.getIDToken();
        if (!idToken) {
          throw new Error("ไม่พบ ID Token กรุณาตรวจสอบว่า LIFF เปิด Scope openid แล้ว");
        }

        setStatus("กำลังโหลดข้อมูลลูกค้า...");
        const customer = await callApi({ action: "getCustomer", idToken });

        if (customer && customer.found) {
          document.getElementById("name").value = customer.name || "";
          document.getElementById("address").value = customer.address || "";
          document.getElementById("zipcode").value = customer.zipcode || "";
          document.getElementById("phone").value = customer.phone || "";
          setStatus("💗 โหลดข้อมูลที่อยู่เดิมแล้ว");
        } else {
          setStatus("ยินดีต้อนรับ 💗 กรุณากรอกข้อมูลจัดส่ง");
        }

        setButtonsEnabled(true);

      } catch (error) {
        console.error("LIFF error:", error);
        setStatus("เชื่อมต่อไม่สำเร็จ: " + (error && error.message ? error.message : error));
      }
    }

    async function submitData(mode) {
      if (!idToken) {
        setStatus("ยังยืนยันบัญชี LINE ไม่สำเร็จ กรุณาเปิดหน้าเว็บใหม่");
        return;
      }

      const data = {
        order: document.getElementById("order").value.trim(),
        name: document.getElementById("name").value.trim(),
        address: document.getElementById("address").value.trim(),
        zipcode: document.getElementById("zipcode").value.trim(),
        phone: document.getElementById("phone").value.trim()
      };

      if (!data.name || !data.address || !data.zipcode || !data.phone) {
        setStatus("❗ กรุณากรอกชื่อ ที่อยู่ รหัสไปรษณีย์ และเบอร์โทรให้ครบ");
        return;
      }

      if (mode === "newOrder" && !data.order) {
        setStatus("❗ กรุณากรอกรอบพรี/สินค้าก่อนบันทึกออเดอร์ใหม่");
        return;
      }

      setButtonsEnabled(false);
      setStatus("กำลังบันทึกข้อมูล...");

      try {
        const result = await callApi({
          action: "saveSubmission",
          idToken: idToken,
          mode: mode,
          order: data.order,
          name: data.name,
          address: data.address,
          zipcode: data.zipcode,
          phone: data.phone
        });

        setStatus("✅ " + result.message);
        if (mode === "newOrder") {
          document.getElementById("order").value = "";
        }
      } catch (error) {
        setStatus("❌ บันทึกไม่สำเร็จ: " + (error && error.message ? error.message : error));
      }

      setButtonsEnabled(true);
    }

    startLine();
  </script>
</body>
</html>
